<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // మీ ఫైర్‌బేస్ కన్సోల్ నుండి తీసుకున్న సరైన కాన్ఫిగరేషన్
  const firebaseConfig = {
    apiKey: "AIzaSyAzw4hSem8AsfahZKpK_GMgXpKVkM3L16S4",
    authDomain: "brahmanee-cb903.firebaseapp.com",
    projectId: "brahmanee-cb903",
    storageBucket: "brahmanee-cb903.appspot.com",
    messagingSenderId: "416826587585",
    appId: "1:416826587585:web:b349764f17f0f6b4bfa0d8"
  };

  // ఫైర్‌బేస్ ఇనిషియలైజేషన్
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // రీకాప్చా సెటప్ (OTP కోసం)
  window.onload = function() {
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      'size': 'invisible'
    });
  };

  // OTP పంపే ఫంక్షన్
  window.sendOTP = function() {
    const phoneNumber = document.getElementById('phoneNo').value;
    const appVerifier = window.recaptchaVerifier;

    signInWithPhoneNumber(auth, phoneNumber, appVerifier)
      .then((confirmationResult) => {
        window.confirmationResult = confirmationResult;
        document.getElementById('phone-auth-box').style.display = 'none';
        document.getElementById('otp-auth-box').style.display = 'block';
        alert("OTP సక్సెస్‌ఫుల్‌గా పంపబడింది!");
      }).catch((error) => {
        console.error("OTP పంపడంలో లోపం:", error);
        alert("OTP పంపడం కుదరలేదు. నంబర్ సరిచూసుకోండి.");
      });
  }

  // OTP వెరిఫై చేసే ఫంక్షన్
  window.verifyOTP = function() {
    const code = document.getElementById('otpCode').value;
    window.confirmationResult.confirm(code).then((result) => {
      const user = result.user;
      alert("లాగిన్ విజయవంతమైంది! నంబర్: " + user.phoneNumber);
      // ఇక్కడ లాగిన్ తర్వాత వెళ్ళవలసిన పేజీని సెట్ చేసుకోవచ్చు
    }).catch((error) => {
      alert("తప్పు OTP! దయచేసి మళ్లీ ప్రయత్నించండి.");
    });
  }
</script>
