<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brahmanee - Phone Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px; border: none; border-radius: 5px; width: 100%; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #a5d6a7; cursor: not-allowed; }
        .link-btn { background: none; border: none; color: #4CAF50; text-decoration: underline; width: auto; padding: 5px; font-size: 14px; margin-top: 5px; cursor: pointer; }
        .link-btn:hover { background: none; color: #2e7031; }
        .error-text { color: #d32f2f; font-size: 13px; min-height: 16px; margin: 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>లాగిన్ / సైన్ ఇన్</h2>

        <!-- ఫోన్ నంబర్ బాక్స్ -->
        <div id="phone-auth-box">
            <p>మీ ఫోన్ నంబర్ ఎంటర్ చేయండి</p>
            <input type="tel" id="phoneNo" placeholder="10 అంకెల నంబర్ (ఉదా: 7207387919)">
            <p class="error-text" id="phoneError"></p>
            <button id="sendOtpBtn" onclick="sendOTP()">OTP పంపు</button>
        </div>

        <!-- OTP ఎంటర్ చేసే బాక్స్ -->
        <div id="otp-auth-box" style="display: none;">
            <p>OTP కోడ్ ఎంటర్ చేయండి</p>
            <input type="text" id="otpCode" placeholder="6 అంకెల OTP" maxlength="6">
            <p class="error-text" id="otpError"></p>
            <button id="verifyOtpBtn" onclick="verifyOTP()">వెరిఫై చేయి</button>
            <button class="link-btn" onclick="backToPhone()">← నంబర్ మార్చాలా? వెనక్కి వెళ్ళండి</button>
        </div>

        <!-- రీకాప్చా కోసం కంటైనర్ -->
        <div id="recaptcha-container"></div>
    </div>

    <!-- ఫైర్‌బేస్ స్క్రిప్ట్ -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAzw4hSem8AsfahZKpK_GMgXpKVkM3L16S4",
        authDomain: "brahmanee-cb903.firebaseapp.com",
        projectId: "brahmanee-cb903",
        storageBucket: "brahmanee-cb903.appspot.com",
        messagingSenderId: "416826587585",
        appId: "1:416826587585:web:b349764f17f0f6b4bfa0d8"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      function setupRecaptcha() {
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
          'size': 'invisible'
        });
      }

      window.onload = function() {
        setupRecaptcha();
      };

      window.backToPhone = function() {
        document.getElementById('otp-auth-box').style.display = 'none';
        document.getElementById('phone-auth-box').style.display = 'block';
        document.getElementById('otpCode').value = '';
        document.getElementById('otpError').textContent = '';
      };

      window.sendOTP = function() {
        const phoneInput = document.getElementById('phoneNo');
        const phoneErrorEl = document.getElementById('phoneError');
        const sendBtn = document.getElementById('sendOtpBtn');
        phoneErrorEl.textContent = '';

        let phoneNumber = phoneInput.value.trim();

        if (!phoneNumber) {
          phoneErrorEl.textContent = "దయచేసి ఫోన్ నంబర్ ఎంటర్ చేయండి.";
          return;
        }

        phoneNumber = phoneNumber.replace(/[\s-]/g, '');

        if (!phoneNumber.startsWith('+')) {
          phoneNumber = phoneNumber.replace(/^0+/, '');
          phoneNumber = '+91' + phoneNumber;
        }

        const phoneRegex = /^\+[1-9]\d{9,14}$/;
        if (!phoneRegex.test(phoneNumber)) {
          phoneErrorEl.textContent = "సరైన 10 అంకెల నంబర్ ఎంటర్ చేయండి.";
          return;
        }

        sendBtn.disabled = true;
        sendBtn.textContent = "పంపుతోంది...";

        const appVerifier = window.recaptchaVerifier;

        signInWithPhoneNumber(auth, phoneNumber, appVerifier)
          .then((confirmationResult) => {
            window.confirmationResult = confirmationResult;
            document.getElementById('phone-auth-box').style.display = 'none';
            document.getElementById('otp-auth-box').style.display = 'block';
            sendBtn.disabled = false;
            sendBtn.textContent = "OTP పంపు";
            alert("OTP సక్సెస్‌ఫుల్‌గా పంపబడింది!");
          }).catch((error) => {
            console.error("OTP పంపడంలో లోపం:", error);
            sendBtn.disabled = false;
            sendBtn.textContent = "OTP పంపు";

            if (error.code === 'auth/invalid-phone-number') {
              phoneErrorEl.textContent = "ఫోన్ నంబర్ ఫార్మాట్ తప్పుగా ఉంది.";
            } else if (error.code === 'auth/too-many-requests') {
              phoneErrorEl.textContent = "చాలా ప్రయత్నాలు జరిగాయి. కొంతసేపు ఆగి ప్రయత్నించండి.";
            } else {
              phoneErrorEl.textContent = "OTP పంపడం కుదరలేదు. మళ్లీ ప్రయత్నించండి.";
            }

            if (window.recaptchaVerifier) {
              window.recaptchaVerifier.clear();
            }
            document.getElementById('recaptcha-container').innerHTML = '';
            setupRecaptcha();
          });
      }

      window.verifyOTP = function() {
        const otpInput = document.getElementById('otpCode');
        const otpErrorEl = document.getElementById('otpError');
        const verifyBtn = document.getElementById('verifyOtpBtn');
        otpErrorEl.textContent = '';

        const code = otpInput.value.trim();

        if (!code || code.length !== 6) {
          otpErrorEl.textContent = "6 అంకెల OTP సరిగ్గా ఎంటర్ చేయండి.";
          return;
        }

        if (!window.confirmationResult) {
          otpErrorEl.textContent = "సెషన్ ముగిసింది. దయచేసి మళ్లీ OTP పంపండి.";
          return;
        }

        verifyBtn.disabled = true;
        verifyBtn.textContent = "వెరిఫై అవుతోంది...";

        window.confirmationResult.confirm(code).then((result) => {
          const user = result.user;
          verifyBtn.disabled = false;
          verifyBtn.textContent = "వెరిఫై చేయి";
          alert("లాగిన్ విజయవంతమైంది! నంబర్: " + user.phoneNumber);
        }).catch((error) => {
          console.error("OTP verify లోపం:", error);
          verifyBtn.disabled = false;
          verifyBtn.textContent = "వెరిఫై చేయి";

          if (error.code === 'auth/code-expired') {
            otpErrorEl.textContent = "OTP గడువు ముగిసింది. మళ్లీ పంపండి.";
          } else {
            otpErrorEl.textContent = "తప్పు OTP! దయచేసి సరిగ్గా ఎంటర్ చేయండి.";
          }
        });
      }
    </script>
</body>
</html>
