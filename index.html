<!-- ఫైర్‌బేస్ స్క్రిప్ట్స్ -->
<script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-auth-compat.js"></script>

<div id="login-container" style="max-width: 400px; margin: auto; padding: 20px; font-family: Arial;">
    <h2>Brahmanee.com Login</h2>
    
    <!-- మొబైల్ నెంబర్ ఎంటర్ చేసే ఫారమ్ -->
    <div id="phone-auth-box">
        <label>Mobile Number (with +91):</label><br>
        <input type="text" id="phoneNumber" placeholder="+919876543210" style="width: 100%; padding: 8px; margin: 10px 0;"><br>
        <button id="sign-in-button" onclick="sendOTP()" style="background: blue; color: white; padding: 10px 20px; border: none; cursor: pointer;">Send OTP</button>
    </div>

    <!-- OTP వెరిఫికేషన్ ఫారమ్ -->
    <div id="otp-auth-box" style="display: none; margin-top: 20px;">
        <label>Enter OTP:</label><br>
        <input type="text" id="otpCode" placeholder="Enter 6-digit OTP" style="width: 100%; padding: 8px; margin: 10px 0;"><br>
        <button onclick="verifyOTP()" style="background: green; color: white; padding: 10px 20px; border: none; cursor: pointer;">Verify OTP & Login</button>
    </div>

    <div id="recaptcha-container"></div>
</div>

<script>
    // ఫైర్‌బేస్ కాన్ఫిగరేషన్ (మీ ప్రాజెక్ట్ వివరాలు ఇక్కడ వస్తాయి)
    const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "brahmanee.firebaseapp.com",
        projectId: "brahmanee",
        storageBucket: "brahmanee.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // ఫైర్‌బేస్ ఇనిషియలైజేషన్
    firebase.initializeApp(firebaseConfig);

    // రీకాప్చా సెటప్
    window.onload = function() {
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
            'size': 'invisible'
        });
    };

    // OTP పంపే ఫంక్షన్
    function sendOTP() {
        const phoneNumber = document.getElementById('phoneNumber').value;
        const appVerifier = window.recaptchaVerifier;

        firebase.auth().signInWithPhoneNumber(phoneNumber, appVerifier)
            .then(function (confirmationResult) {
                window.confirmationResult = confirmationResult;
                alert("OTP sent successfully to " + phoneNumber);
                document.getElementById('phone-auth-box').style.display = 'none';
                document.getElementById('otp-auth-box').style.display = 'block';
            }).catch(function (error) {
                console.error("Error during sending OTP: ", error);
                alert("Error sending OTP. Please check the number.");
            });
    }

    // OTP వెరిఫై చేసే ఫంక్షన్
    function verifyOTP() {
        const code = document.getElementById('otpCode').value;
        window.confirmationResult.confirm(code).then(function (result) {
            const user = result.user;
            alert("Login Successful! Welcome: " + user.phoneNumber);
            // ఇక్కడ యూజర్ లాగిన్ అయ్యాక అడ్మిన్ అప్రూవల్ పేజీకి లేదా డాష్‌బోర్డ్‌కి పంపవచ్చు
        }).catch(function (error) {
            alert("Invalid OTP! Please try again.");
        });
    }
</script>
